<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 80 1800 900" role="img" aria-labelledby="ttl">
<title id="ttl">domain/ 内部分块架构（ADR-0002）</title>
<defs>
  <style>
    svg{font-family:"Times New Roman","Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;fill:#1A1A1A}
    text{text-anchor:middle}
    .m{font-family:Consolas,"Cascadia Mono","Courier New",monospace}
    .st{text-anchor:start}
    .t{font-size:16px;font-weight:600}
    .n{font-size:14px;font-weight:600}
    .b{font-size:13px}
    .s{font-size:12.5px;fill:#555}
    .box{stroke:#333;stroke-width:1.2}
    .ln{fill:none;stroke:#333;stroke-width:1.2}
    .rt{fill:none;stroke:#555;stroke-width:1.2;stroke-dasharray:5 4}
    .port{fill:#FFFFFF;stroke:#333;stroke-width:1.3}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
    <path d="M0,1.2 L10,5 L0,8.8 Z" fill="#333"/>
  </marker>
</defs>

<rect width="1800" height="980" fill="#FFFFFF"/>

<!-- 六边形：domain 核心 -->
<path d="M320,110 H1440 L1560,507.5 L1440,905 H320 L200,507.5 Z" fill="#FAFAF8" stroke="#333" stroke-width="1.4"/>
<text x="880" y="137" style="font-size:14px;fill:#333"><tspan class="m">domain/</tspan>（六边形核心：端口 + 适配器）</text>

<!-- ④ 模型层 -->
<rect class="box" x="330" y="150" width="550" height="130" rx="3" fill="#F3EFF8"/>
<text class="t" x="605" y="172">④ 模型层</text>
<line x1="330" y1="182" x2="880" y2="182" stroke="#333" stroke-width="0.8"/>
<rect class="box" x="355" y="194" width="150" height="48" rx="3" fill="#FFFFFF"/>
<text class="n" x="430" y="214">flash 模型</text>
<text class="s" x="430" y="233">默认</text>
<rect class="box" x="705" y="194" width="150" height="48" rx="3" fill="#FFFFFF"/>
<text class="n" x="780" y="214">强模型</text>
<text class="s" x="780" y="233">约 1/3 题</text>
<line class="ln" x1="505" y1="218" x2="705" y2="218" marker-end="url(#ar)"/>
<text class="b" x="605" y="210">行为信号触发升级</text>
<text class="s" x="605" y="236" style="font-size:12px">（无进展、重复动作）</text>
<text class="s" x="605" y="266">flag 由平台 oracle 校验，不做投票</text>

<!-- 协调层 -->
<rect class="box" x="950" y="150" width="480" height="130" rx="3" fill="#EEEEEE"/>
<text class="t" x="1190" y="172">协调层<tspan font-weight="400" font-size="13" fill="#555">（不参与解题）</tspan></text>
<line x1="950" y1="182" x2="1430" y2="182" stroke="#333" stroke-width="0.8"/>
<g class="b">
  <text class="st" x="972" y="208">心跳监控、卡住判定（看行为信号）</text>
  <text class="st" x="972" y="232">梯度升级、预算分配、止损</text>
  <text class="st" x="972" y="256">首个 flag 验真后取消其余 Solver</text>
</g>
<line class="ln" x1="950" y1="216" x2="880" y2="216" marker-end="url(#ar)"/>
<text class="b" x="915" y="208">触发升级</text>

<!-- 控制面 ⇄ Swarm -->
<line class="ln" x1="605" y1="280" x2="605" y2="330" marker-end="url(#ar)"/>
<text class="b st" x="615" y="310">分配模型</text>
<line class="ln" x1="1080" y1="280" x2="1080" y2="330" marker-end="url(#ar)"/>
<text class="b st" x="1090" y="310">调度 / 取消</text>
<line class="rt" x1="1300" y1="330" x2="1300" y2="280" marker-end="url(#ar)"/>
<text class="b st" x="1310" y="310">心跳</text>

<!-- Swarm：Solver × k（plate） -->
<rect x="290" y="330" width="1180" height="410" rx="5" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/>
<text class="st" x="310" y="356" style="font-size:15px;font-weight:600">Swarm 竞速：Solver × k<tspan font-weight="400" font-size="13" fill="#555">（同题多模型并行）</tspan></text>
<text x="1452" y="728" style="text-anchor:end;font-size:13px;font-style:italic;fill:#555">k = 2–3</text>

<!-- ① 主控循环 -->
<rect class="box" x="330" y="410" width="210" height="120" rx="3" fill="#E6EEF8"/>
<text class="t" x="435" y="432">① 主控循环</text>
<line x1="330" y1="442" x2="540" y2="442" stroke="#333" stroke-width="0.8"/>
<text class="b" x="435" y="472">事件驱动 <tspan class="m" font-size="12">while</tspan> 循环</text>
<text class="b" x="435" y="498">ReAct + 活计划（todo）</text>
<path class="ln" d="M420,410 C420,376 480,376 480,410" marker-end="url(#ar)"/>
<text class="s st" x="494" y="390">Plan → Execute → Parse → Iterate</text>

<!-- 协议层 -->
<rect class="box" x="600" y="410" width="190" height="120" rx="3" fill="#F0F4FA"/>
<text class="t" x="695" y="432">协议层（断路器）</text>
<line x1="600" y1="442" x2="790" y2="442" stroke="#333" stroke-width="0.8"/>
<g class="b">
  <text x="695" y="466">入参类型、白名单校验</text>
  <text x="695" y="490"><tspan class="m" font-size="12">stderr</tspan>、退出码回灌</text>
  <text x="695" y="514">失败尝试去重</text>
</g>

<!-- ② 工具层 -->
<rect class="box" x="850" y="390" width="580" height="170" rx="3" fill="#E7F2EA"/>
<text class="t" x="1140" y="412">② 工具层</text>
<line x1="850" y1="422" x2="1430" y2="422" stroke="#333" stroke-width="0.8"/>
<text class="b st" x="870" y="447">CodeAct 主干：<tspan class="m" font-size="12">execute</tspan>（Python + bash，沙箱内运行）</text>
<text class="b st" x="870" y="471">结构化封装 5–12 个：<tspan class="m" font-size="12">gdb</tspan>、<tspan class="m" font-size="12">pwntools</tspan>、<tspan class="m" font-size="12">submit_flag</tspan>、headless 浏览器等</text>
<text class="b st" x="870" y="507">分类渐进披露：</text>
<rect x="966" y="491" width="70" height="24" rx="2" fill="#FFFFFF" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
<text x="1001" y="507.5" class="m" style="font-size:12px;fill:#888">web_*</text>
<rect class="box" x="1044" y="491" width="70" height="24" rx="2" fill="#BFDCC8"/>
<text x="1079" y="507.5" class="m" style="font-size:12px;font-weight:700">pwn_*</text>
<rect x="1122" y="491" width="70" height="24" rx="2" fill="#FFFFFF" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
<text x="1157" y="507.5" class="m" style="font-size:12px;fill:#888">ai_*</text>
<text class="s st" x="1206" y="507">← 只向模型暴露当前题类</text>
<text class="s st" x="870" y="541">同时可见 ≤ 10 个，系统总量 ≤ 20 个</text>

<!-- 调用 / 回灌 -->
<line class="ln" x1="540" y1="455" x2="600" y2="455" marker-end="url(#ar)"/>
<line class="ln" x1="790" y1="455" x2="850" y2="455" marker-end="url(#ar)"/>
<line class="rt" x1="850" y1="490" x2="790" y2="490" marker-end="url(#ar)"/>
<line class="rt" x1="600" y1="490" x2="540" y2="490" marker-end="url(#ar)"/>
<text class="b" x="570" y="447">调用</text>
<text class="b" x="570" y="507">回灌</text>

<!-- ③ 上下文与记忆（分层） -->
<rect class="box" x="330" y="625" width="150" height="80" fill="#F1E4CC"/>
<text x="405" y="660" style="font-size:15px;font-weight:600">③ 上下文与记忆</text>
<text class="s" x="405" y="684" style="font-size:12px">压缩仅作兜底</text>
<g class="box" fill="#F8F0E2">
  <rect x="480" y="625" width="237.5" height="80"/>
  <rect x="717.5" y="625" width="237.5" height="80"/>
  <rect x="955" y="625" width="237.5" height="80"/>
  <rect x="1192.5" y="625" width="237.5" height="80"/>
</g>
<g class="n">
  <text x="598.75" y="657">主上下文</text>
  <text x="836.25" y="657">Scratchpad</text>
  <text x="1073.75" y="657">文件卸载</text>
  <text x="1311.25" y="657">子 agent 隔离</text>
</g>
<g class="s">
  <text x="598.75" y="683">精简结构化 JSON</text>
  <text x="836.25" y="683"><tspan class="m" font-size="12">findings.md</tspan>、<tspan class="m" font-size="12">deadends.md</tspan></text>
  <text x="1073.75" y="683">原始输出落盘，只留路径</text>
  <text x="1311.25" y="683">recon 只回传结论</text>
</g>
<line class="ln" x1="510" y1="530" x2="510" y2="625" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text class="b st" x="522" y="582">读 / 写</text>
<line class="ln" x1="1070" y1="560" x2="1070" y2="625" marker-end="url(#ar)"/>
<text class="b st" x="1082" y="597">原始输出</text>

<!-- 跨切面策略 -->
<rect class="box" x="330" y="775" width="170" height="80" fill="#E6E6E6"/>
<text x="415" y="810" style="font-size:15px;font-weight:600">跨切面策略</text>
<text x="415" y="834" class="m" style="font-size:12px;fill:#555">policy.py</text>
<g class="box" fill="#F4F4F4">
  <rect x="500" y="775" width="186" height="80"/>
  <rect x="686" y="775" width="186" height="80"/>
  <rect x="872" y="775" width="186" height="80"/>
  <rect x="1058" y="775" width="186" height="80"/>
  <rect x="1244" y="775" width="186" height="80"/>
</g>
<g class="n">
  <text x="593" y="807">抗注入</text>
  <text x="779" y="807">flag 校验</text>
  <text x="965" y="807">ROI 预算</text>
  <text x="1151" y="807">失败落盘</text>
  <text x="1337" y="807">分节暂停</text>
</g>
<g class="s">
  <text x="593" y="833">返回内容一律视为数据</text>
  <text x="779" y="833">只认 oracle，提交有上限</text>
  <text x="965" y="833">每题限额，难题止损</text>
  <text x="1151" y="833">异常也写 <tspan class="m" font-size="12">result.json</tspan></text>
  <text x="1337" y="833">暂停期间 sleep</text>
</g>

<!-- 外部适配器 -->
<rect class="box" x="40" y="185" width="180" height="50" rx="3" fill="#FFFFFF"/>
<text class="n" x="130" y="206">模型网关</text>
<text class="s" x="130" y="226">GLM、DeepSeek、Kimi</text>

<rect class="box" x="1590" y="190" width="170" height="50" rx="3" fill="#FFFFFF"/>
<text class="n" x="1675" y="211">比赛平台（MCP）</text>
<text class="s" x="1675" y="231">flag oracle</text>

<rect class="box" x="1590" y="440" width="170" height="50" rx="3" fill="#FFFFFF"/>
<text class="n" x="1675" y="461">沙箱</text>
<text class="s" x="1675" y="481">单容器，断网</text>

<rect class="box" x="1590" y="505" width="170" height="50" rx="3" fill="#FFFFFF"/>
<text class="n" x="1675" y="526">靶机</text>
<text class="s" x="1675" y="546">TLS + SNI:443</text>

<!-- 经端口的连接 -->
<line class="ln" x1="330" y1="210" x2="220" y2="210" marker-end="url(#ar)"/>
<path class="rt" d="M1590,215 H1430" marker-end="url(#ar)"/>
<text class="b" x="1530" y="207">验真结果</text>
<path class="ln" d="M1430,410 H1675 V240" marker-end="url(#ar)"/>
<text class="m" x="1600" y="402" style="font-size:12px">submit_flag</text>
<line class="ln" x1="1430" y1="465" x2="1590" y2="465" marker-end="url(#ar)"/>
<line class="ln" x1="1430" y1="530" x2="1590" y2="530" marker-end="url(#ar)"/>
<g class="port">
  <rect x="284.8" y="205" width="10" height="10"/>
  <rect x="1466.7" y="210" width="10" height="10"/>
  <rect x="1525.6" y="405" width="10" height="10"/>
  <rect x="1542.2" y="460" width="10" height="10"/>
  <rect x="1548.2" y="525" width="10" height="10"/>
</g>

<!-- 图注 -->
<text x="900" y="950" style="font-size:14px;fill:#333"><tspan font-weight="600">图 1</tspan>　<tspan class="m">domain/</tspan> 内部分块架构（ADR-0002）。六边形为 domain 核心，□ 为端口；实线为调用，虚线为返回或信号。</text>
</svg>
